services:
  postgres:
    image: postgres:16-alpine
    container_name: claim_engine
    restart: unless-stopped
    environment:
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claim
      POSTGRES_DB: claims_engine
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claim -d claims_engine"]
      interval: 5s
      retries: 10

volumes:
  pgdata: